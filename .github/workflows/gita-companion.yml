name: gita-companion

on:
  push:
    paths: ["gita-companion/**", ".github/workflows/gita-companion.yml"]
  pull_request:
    paths: ["gita-companion/**", ".github/workflows/gita-companion.yml"]

permissions:
  contents: read

jobs:
  content:
    name: Content pipeline
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gita-companion/content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

      # Rebuild the dataset from the pinned upstream sources and require the
      # committed data/gita.json and report to be reproduced exactly.
      - name: Fetch pinned sources
        run: |
          fetch() { git init -q "$1" && git -C "$1" fetch -q --depth 1 "$2" "$3" && git -C "$1" checkout -q FETCH_HEAD; }
          fetch "$RUNNER_TEMP/gita"  https://github.com/gita/gita.git c6fce39595445768876ddbb8d1268a9c935e1d2b
          fetch "$RUNNER_TEMP/vs"    https://github.com/vedicscriptures/bhagavad-gita-data.git 43dfc8db815d01e15a347ea294b089334cf2aa17
      - name: Rebuild and check reproducibility
        run: |
          gita-content besant   # Besant (1922) from the committed Wikisource snapshot
          git diff --exit-code -- sources/
          gita-content build --gita-json "$RUNNER_TEMP/gita/data/verse.json" --verify-with "$RUNNER_TEMP/vs/slok" \
            --translation besant-1922-en=sources/besant-1922/besant-1922-en.jsonl
          git diff --exit-code -- data/
      - name: Retrieval quality (golden set)
        run: python -m gita_content.evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: gita-content-pack
          path: gita-companion/content/build/gita_content_pack.sqlite

  backend:
    name: Backend (API, database, tutor)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: gita-companion/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The content generator (workers/) uses the canonical verse table from the content package.
      - run: pip install -e ../content -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      # Known vulnerabilities in the server's dependencies fail the build.
      - name: Dependency audit
        run: |
          pip install --upgrade pip setuptools pip-audit
          pip-audit --skip-editable
      - name: Cost measurements (tokens, database, bandwidth)
        run: pytest -q -s tests/test_costs.py | grep '^COST' || true
      - name: Build the API container
        working-directory: gita-companion
        run: docker build -f backend/Dockerfile -t gita-api .

  mobile:
    name: Mobile app (tests + APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gita-companion/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Build content pack from the committed dataset
        run: |
          pip install -e ../content
          tool/sync_content.sh
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Check formatting (hand-written files only)
        run: dart format --set-exit-if-changed $(git ls-files "lib/*.dart" "test/*.dart")
      - run: flutter analyze
      - run: flutter test
      - name: Performance benchmarks
        run: flutter test test/perf 2>&1 | grep -E '^BENCH|tests passed|failed'
      # Release signing. With the repository secrets GITA_KEYSTORE_BASE64,
      # GITA_KEYSTORE_PASSWORD, GITA_KEY_ALIAS and GITA_KEY_PASSWORD (see
      # gita-companion/docs/RELEASE.md) the APK is signed with your release
      # key. Without them a throwaway key proves the signing path works; such
      # an APK is for testing only.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.GITA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GITA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GITA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GITA_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            STORE_PASSWORD="test-$(openssl rand -hex 16)"; KEY_PASSWORD="$STORE_PASSWORD"; KEY_ALIAS=test
            echo "::add-mask::$STORE_PASSWORD"
            keytool -genkeypair -keystore "$ks" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Gita Companion test build"
            echo "SIGNED_WITH=throwaway test key (add the GITA_KEYSTORE_* secrets for a real release)" >> "$GITHUB_ENV"
          fi
          { echo "GITA_KEYSTORE=$ks"; echo "GITA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "GITA_KEY_ALIAS=$KEY_ALIAS"; echo "GITA_KEY_PASSWORD=$KEY_PASSWORD"; } >> "$GITHUB_ENV"
      # The tutor's server address. Optional: set the repository variable
      # GITA_API_BASE_URL (Settings → Secrets and variables → Actions →
      # Variables), or enter the address in the app's settings.
      # Dart code is obfuscated; the symbols to read crash reports are kept
      # as an artifact.
      - name: Build release APKs
        run: |
          flags="--release --obfuscate --split-debug-info=build/symbols --dart-define=API_BASE_URL=${{ vars.GITA_API_BASE_URL }}"
          flutter build apk $flags
          flutter build apk $flags --split-per-abi
      - name: Verify signature and report sizes
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cd build/app/outputs/flutter-apk
          for apk in app-release.apk app-*-release.apk; do
            "$apksigner" verify "$apk"
            echo "APK $apk: $(du -h "$apk" | cut -f1)"
          done
          # Which key signed it (the label differs between apksigner versions).
          "$apksigner" verify --print-certs app-release.apk | grep -E "certificate (DN|SHA-256 digest):" | head -2
          echo "Signed with: $SIGNED_WITH"
      - uses: actions/upload-artifact@v4
        with:
          name: gita-companion-apk
          path: |
            gita-companion/mobile/build/app/outputs/flutter-apk/app-release.apk
            gita-companion/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            gita-companion/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gita-companion-debug-symbols
          path: gita-companion/mobile/build/symbols
