name: gita-companion

on:
  push:
    paths: ["gita-companion/**", ".github/workflows/gita-companion.yml"]
  pull_request:
    paths: ["gita-companion/**", ".github/workflows/gita-companion.yml"]

permissions:
  contents: read

jobs:
  content:
    name: Content pipeline
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gita-companion/content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

      # Rebuild the dataset from the pinned upstream sources and require the
      # committed data/gita.json and report to be reproduced exactly.
      - name: Fetch pinned sources
        run: |
          fetch() { git init -q "$1" && git -C "$1" fetch -q --depth 1 "$2" "$3" && git -C "$1" checkout -q FETCH_HEAD; }
          fetch "$RUNNER_TEMP/gita"  https://github.com/gita/gita.git c6fce39595445768876ddbb8d1268a9c935e1d2b
          fetch "$RUNNER_TEMP/vs"    https://github.com/vedicscriptures/bhagavad-gita-data.git 43dfc8db815d01e15a347ea294b089334cf2aa17
      - name: Rebuild and check reproducibility
        run: |
          gita-content build --gita-json "$RUNNER_TEMP/gita/data/verse.json" --verify-with "$RUNNER_TEMP/vs/slok"
          git diff --exit-code -- data/
      - uses: actions/upload-artifact@v4
        with:
          name: gita-content-pack
          path: gita-companion/content/build/gita_content_pack.sqlite

  backend:
    name: Backend (API, database, tutor)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: gita-companion/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The content generator (workers/) uses the canonical verse table from the content package.
      - run: pip install -e ../content -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Build the API container
        working-directory: gita-companion
        run: docker build -f backend/Dockerfile -t gita-api .

  mobile:
    name: Mobile app (tests + APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gita-companion/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Build content pack from the committed dataset
        run: |
          pip install -e ../content
          tool/sync_content.sh
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Check formatting (hand-written files only)
        run: dart format --set-exit-if-changed $(git ls-files "lib/*.dart" "test/*.dart")
      - run: flutter analyze
      - run: flutter test
      # The tutor's server address. Optional: set the repository variable
      # GITA_API_BASE_URL (Settings → Secrets and variables → Actions →
      # Variables), or enter the address in the app's settings.
      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.GITA_API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: gita-companion-apk
          path: gita-companion/mobile/build/app/outputs/flutter-apk/app-release.apk
