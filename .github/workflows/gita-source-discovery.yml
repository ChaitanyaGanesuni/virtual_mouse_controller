name: gita-source-discovery

# Fetches public-domain source texts that the build sandbox cannot reach and
# prints them to the job log for review. Nothing is imported automatically:
# a reviewed snapshot is committed under gita-companion/content/sources/.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gita-source-discovery.yml"
      - "gita-companion/content/tools/discover_sources.py"
      - "gita-companion/content/tools/fetch_besant.py"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gita-companion/content/tools/fetch_besant.py
