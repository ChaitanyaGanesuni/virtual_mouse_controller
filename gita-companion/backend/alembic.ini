[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# DATABASE_URL from the environment overrides this (see migrations/env.py).
sqlalchemy.url = postgresql+psycopg://gita:gita@localhost:5432/gita

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
