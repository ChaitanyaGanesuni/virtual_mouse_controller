[project]
name = "gita-backend"
version = "0.1.0"
description = "Gita Companion backend (FastAPI modular monolith): accounts and the AI tutor"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<2.2",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<0.6",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyJWT>=2.9,<3",
  "cryptography>=43,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Batch Sanskrit recitation on a GPU machine (workers/generate_recitation.py);
# parler-tts itself is installed from git, see README.
tts = ["torch", "transformers", "numpy"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # generated SQL constraint strings
