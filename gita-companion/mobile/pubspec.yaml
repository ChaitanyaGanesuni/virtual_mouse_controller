name: gita_companion
description: "Gita Companion: read, listen to, understand and apply the Bhagavad Gita."
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # version pinned by flutter_localizations
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.35.1
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Built by the content pipeline (tool/sync_content.sh); not committed.
    - assets/content/gita_content_pack.sqlite
    - assets/content/pack_manifest.json
    - assets/fonts/OFL.txt

  fonts:
    # All SIL Open Font License 1.1 (assets/fonts/OFL.txt). Variable fonts:
    # weights are selected with FontVariation('wght', ...).
    - family: NotoSerifDevanagari
      fonts:
        - asset: assets/fonts/NotoSerifDevanagari.ttf
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu.ttf
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif.ttf
