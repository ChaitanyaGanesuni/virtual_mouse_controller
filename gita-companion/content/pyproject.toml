[project]
name = "gita-content"
version = "0.1.0"
description = "Gita Companion content pipeline: canonical Sanskrit text, transliteration, content pack"
requires-python = ">=3.11"
dependencies = [
  "indic_transliteration>=2.3,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gita-content = "gita_content.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gita_content*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Devanagari/IAST characters are intentional
