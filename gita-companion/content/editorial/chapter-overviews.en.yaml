# Chapter overviews (English), source: gita-companion-editorial.
#
# Drafted with AI assistance during development, describing the narrative
# and teaching of each chapter in plain words. They deliberately contain no
# quotations of any translation and no verse numbers. Status: unreviewed;
# shown in the app with an "AI-assisted" label until a reviewer signs off.

language: en
source: gita-companion-editorial
chapters:
  1:
    theme: A warrior's crisis of grief and moral confusion opens the way to the teaching.
    summary: >
      On the field of Kurukṣetra the blind king Dhṛtarāṣṭra asks Sañjaya what is happening.
      Sañjaya describes the two armies, Duryodhana reviewing the great warriors, and the sounding
      of the conches. Arjuna asks Kṛṣṇa, his charioteer, to place the chariot between the armies.
      Seeing teachers, grandfathers, cousins and friends on both sides, he is overcome by grief
      and compassion. He argues that the war will destroy families and the order that sustains
      them, says he would rather be killed than kill his own people, and finally sets down his
      bow, unable to fight.
  2:
    theme: The eternal Self, one's duty, and acting with an even mind form an outline of the whole Gītā.
    summary: >
      Arjuna admits his confusion and asks Kṛṣṇa to teach him as a disciple. Kṛṣṇa begins by
      teaching that the Self is eternal: it is not born and does not die when the body dies, so
      the wise do not grieve. He then speaks of Arjuna's own duty as a warrior. Next he introduces
      the discipline of acting without attachment to results, keeping the mind even in success and
      failure. When Arjuna asks how a person of steady wisdom lives, Kṛṣṇa describes someone who
      has withdrawn from cravings, is not shaken by pleasure or pain, has mastered the senses, and
      is at peace.
  3:
    theme: Action offered without selfish attachment does not bind; desire and anger are the real enemies.
    summary: >
      Arjuna asks why he should act at all if knowledge is higher than action. Kṛṣṇa answers that
      no one can remain without acting even for a moment, and that action done as an offering,
      without attachment, does not bind. He describes how the world is sustained by a cycle of
      mutual offering, and why the wise keep acting for the good of the world, since others follow
      their example. It is better to follow one's own duty, even imperfectly, than another's. When
      Arjuna asks what drives a person to wrongdoing, Kṛṣṇa names desire and anger, and teaches how
      to master them.
  4:
    theme: Knowledge frees action from bondage; the Divine takes birth to restore righteousness.
    summary: >
      Kṛṣṇa says this teaching is ancient and was handed down from teacher to teacher until it was
      lost. Questioned by Arjuna, he explains that he takes birth age after age to protect the good
      and re-establish dharma. He examines action, inaction and wrong action, and says the wise see
      inaction in action. Many kinds of sacrifice are described, and the sacrifice of knowledge is
      called the highest. Knowledge is learned from those who have realized the truth, through
      humility, inquiry and service. With faith and self-control it brings peace, while doubt
      destroys.
  5:
    theme: True renunciation is inner freedom within action, which brings equal vision and peace.
    summary: >
      Arjuna asks whether renouncing action or performing it in yoga is better. Kṛṣṇa says both lead
      to the highest good, but the yoga of action is better, and the wise see them as one. Such a
      person acts with body and senses while knowing that the Self does nothing, and offers all
      actions, untouched by them as a lotus leaf is untouched by water. The wise look with an equal
      eye on all beings. Lasting happiness is found within, by mastering desire and anger. The
      chapter ends with a brief description of meditation and of knowing the Divine as the friend
      of all beings.
  6:
    theme: Mastering the mind through meditation, practice and detachment.
    summary: >
      The true renunciant does what is to be done without depending on its fruits. One should raise
      oneself by oneself, for the mind can be one's friend or one's enemy. Kṛṣṇa describes
      meditation: a clean, steady seat, an upright posture, moderation in food, sleep and activity,
      and gently bringing the wandering mind back. The yogī comes to see the Self in all beings and
      all beings in the Self. Arjuna objects that the mind is as restless as the wind; Kṛṣṇa agrees,
      and says it is controlled by steady practice and detachment. One who strives but falls short
      is not lost, and continues in a later life.
  7:
    theme: Knowing the Divine as the source of nature and as what lies beyond it.
    summary: >
      Kṛṣṇa describes his lower nature, made of the elements, mind, intellect and ego, and his higher
      nature, the life that sustains the world; everything rests on him like pearls on a thread. He
      is the essential quality in things, such as the taste in water and the light of the sun and
      moon. The world is bewildered by the three qualities of nature, a divine power that is hard to
      cross, but those who take refuge in him cross it. Four kinds of people turn to him: the
      distressed, those who seek knowledge, those who seek gain, and the wise, who are dearest to
      him.
  8:
    theme: Remembering the Imperishable, in life and at the time of death.
    summary: >
      Arjuna asks about Brahman, the Self, action, and the divine in matter, in the gods and in
      sacrifice, and how the Divine is known at the time of death. Kṛṣṇa answers each briefly and
      teaches that whatever a person remembers at the end, that they attain, so one should remember
      him at all times while doing one's duty. He describes meditation on Oṃ at the time of
      departure, the cosmic day and night in which worlds appear and dissolve, the unmanifest
      Imperishable beyond them, and two paths by which beings depart.
  9:
    theme: The royal knowledge, in which devotion is open to everyone and all rests in the Divine.
    summary: >
      Kṛṣṇa calls this the royal knowledge and the royal secret. All beings rest in him, yet he is
      not confined by them; he brings forth creation and draws it back without being bound by it.
      The deluded overlook him in human form, while great souls worship him with devotion. He is the
      ritual and the offering, the father and mother of the world, its support and its goal. Whatever
      is offered with love, even a leaf, a flower, a fruit or water, he accepts. Anyone who takes
      refuge in him with undivided devotion, whatever their past or station, reaches the highest goal.
  10:
    theme: Seeing the Divine in everything that is excellent and glorious.
    summary: >
      Kṛṣṇa speaks of himself as the origin of gods and sages and of every quality found in beings.
      Those who understand this worship him with love, and he gives them the understanding by which
      they reach him. Arjuna affirms him as the Supreme and asks to hear his divine manifestations.
      Kṛṣṇa names many of them, the foremost in each class of gods, sages, beings, rivers,
      mountains and powers, and concludes that whatever is glorious, beautiful or mighty comes from
      a spark of his splendour, while he sustains the whole universe with a single fraction of
      himself.
  11:
    theme: The vision of the universal form, God as all-consuming Time, and the power of devotion.
    summary: >
      Arjuna asks to see Kṛṣṇa's divine form, and Kṛṣṇa grants him divine sight. Sañjaya and Arjuna
      describe the universal form: countless faces, eyes and arms, the whole universe gathered in
      one place, blazing brighter than a thousand suns. Arjuna sees the warriors of both armies
      rushing into Kṛṣṇa's mouths. Kṛṣṇa declares that he is Time, the destroyer of worlds, that
      the warriors are already slain, and that Arjuna is only the instrument. Shaken, Arjuna praises
      him, asks forgiveness for his past familiarity, and asks to see the gentle form again. Kṛṣṇa
      returns to his human form and says this vision is reached through single-minded devotion.
  12:
    theme: The path of devotion and the qualities of the devotee.
    summary: >
      Arjuna asks who is better established in yoga: those who worship the Divine in personal form
      or those who meditate on the unmanifest Imperishable. Kṛṣṇa says those who worship him with
      steady faith are best, though seekers of the unmanifest also reach him by a harder path. He
      offers a ladder of practices: fix the mind on him; if that is not possible, practise; if not,
      work for his sake; if not, give up the fruits of action. He then describes the devotee who is
      dear to him: free of hatred, friendly and compassionate, without ego, even in pleasure and
      pain, content, and neither disturbing the world nor disturbed by it.
  13:
    theme: Telling apart the field, the body and nature, from its knower, the conscious Self.
    summary: >
      Kṛṣṇa calls the body the field and the one who knows it the knower of the field, and says he
      is the knower in every field. He lists what makes up the field and the qualities that amount
      to true knowledge, such as humility, non-violence, patience and steadiness. He describes the
      supreme Brahman that is to be known, beyond being and non-being, within and outside all
      beings. Nature and spirit are both without beginning; actions are done by nature, and one who
      sees the Self as the non-doer, present equally in all, truly sees. In some editions the chapter
      opens with Arjuna asking about these terms.
  14:
    theme: The three qualities of nature, how they bind, and how one goes beyond them.
    summary: >
      Nature has three qualities, called guṇas: sattva, which is clarity and goodness, rajas, which
      is passion and restless activity, and tamas, which is inertia and darkness. Kṛṣṇa explains how
      each binds the embodied being, the signs by which each can be seen to prevail, and where each
      leads. One who rises above all three is freed from birth, old age, death and sorrow. Asked how
      such a person lives, Kṛṣṇa describes someone unmoved by the play of the qualities, the same in
      pleasure and pain, honour and dishonour, and devoted to him with unwavering devotion.
  15:
    theme: The Supreme Person, beyond both the perishable and the imperishable.
    summary: >
      Kṛṣṇa describes the world as an aśvattha tree with its roots above and branches below, which
      must be cut down with the axe of detachment while seeking the place from which there is no
      return. The individual being is an eternal part of him, carrying the senses from body to body;
      the deluded do not see this, while the wise do. He is the light in the sun and fire, the
      nourishment of plants, and the power of digestion, and he dwells in every heart. There are two
      kinds of being, the perishable and the imperishable, and beyond both is the Supreme Person.
  16:
    theme: The qualities that lead to freedom and those that lead to bondage.
    summary: >
      Kṛṣṇa lists the divine qualities, among them fearlessness, purity, generosity, self-control,
      non-violence, truthfulness, compassion and humility, which lead to freedom, and the demonic
      qualities, among them hypocrisy, arrogance, anger, harshness and ignorance, which lead to
      bondage. He describes the outlook of those who deny any truth or moral order, live for endless
      desires and seek wealth by unjust means. Desire, anger and greed are three gates to ruin, and
      the guidance of scripture should shape what one does and avoids.
  17:
    theme: Faith takes three forms, and it shapes food, worship, discipline and giving.
    summary: >
      Arjuna asks about people who worship with faith but without following scripture. Kṛṣṇa says
      faith takes three forms according to the three qualities of nature, and that a person is what
      their faith is. He describes three kinds of food, of sacrifice, of austerity in body, speech
      and mind, and of giving, each shaped by sattva, rajas or tamas. The chapter closes with
      "Oṃ tat sat" as the threefold name of Brahman, and teaches that what is done without faith
      bears no true fruit.
  18:
    theme: Renouncing attachment to results, surrendering to the Divine, and attaining freedom.
    summary: >
      Arjuna asks the difference between renunciation and letting go. Kṛṣṇa explains that acts of
      sacrifice, giving and discipline should not be abandoned but performed without attachment to
      their fruits; true relinquishment is of the fruits. He analyses the factors of action, and how
      knowledge, action, the doer, understanding, resolve and happiness each take three forms
      according to the qualities of nature. Each person reaches perfection by doing their own work
      as worship. He gives his most intimate teaching, to take refuge in him alone, with the promise
      of freedom. Arjuna declares his confusion gone and says he will act as told, and Sañjaya
      closes the dialogue.
