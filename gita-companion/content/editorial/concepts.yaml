# Concept index: the bridge between how people ask ("I'm anxious about my
# exam results") and the words the Gita uses (phala, saṅga, udvega).
#
# A verse is linked to a concept ONLY if one of the concept's Sanskrit stems
# actually occurs in that verse (checked by the build against the loose IAST
# of the canonical text). No verse numbers are written here by hand.
#
# Fields:
#   id        stable identifier
#   sa        the Sanskrit term shown to users (IAST)
#   en / te   display name, a one-line definition (en), and the words people
#             type for this idea. English terms are matched after light
#             stemming ("worried" = "worry"); multi-word terms match as phrases.
#   stems     loose-romanised substrings (see gita_content.romanize.loose)
#             searched for inside each word of the verse. `weak:` stems count
#             half (common words such as karma, jñāna, ātman).
#   exclude   if a matching word contains one of these, it does not count
#             (e.g. ubhaya "both" is not bhaya "fear").
#   related   concepts to also consider, at lower weight, when this one is asked
#             about ("anxiety" → equanimity, results).
#
# Editorial text, drafted with AI assistance: source gita-companion-editorial,
# unreviewed until a human reviewer approves it.

