# Golden set for retrieval: questions people actually ask, and the verses a
# good answer must draw on. Every expected verse was checked by reading
# Besant's translation and the Sanskrit (see docs/PHASE-7.md); this file must
# not be tuned to the retriever: change it only when a verse is wrong for
# its question, never to raise the score.
#
# Metrics (eval.py): hit@8 = at least one expected verse in the top 8;
# recall@8 = expected verses in the top 8 / min(8, number expected).
# Targets (set before the first measurement): hit@8 >= 0.85, recall@8 >= 0.60,
# for English and for Telugu separately.

