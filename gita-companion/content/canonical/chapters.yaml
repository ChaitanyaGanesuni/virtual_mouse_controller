# Canonical chapter table: the single source of truth for chapter names and
# verse counts. Every verse reference anywhere in the system (content
# pipeline, backend citation validator, mobile app) is validated against
# this file.
#
# Numbering: the common 700-verse numbering. In Chapter 13 many editions
# prefix Arjuna's question (prakṛtiṃ puruṣaṃ caiva ...) as 13.1, giving 35
# verses and 701 in total. We store that verse as 13.0 (is_canonical: false)
# and keep the 701-numbering as an alias edition, so both kinds of
# reference resolve.
#
# name_sa: the chapter-name form used in the traditional colophons
#          (... nāma Xyogaḥ), without the visarga, in Devanagari.
# alt_names_sa: other names attested in common editions.
# name_iast / name_te are NOT stored here: they are generated
# deterministically from name_sa by the pipeline.
# title_en: a plain-English gloss of the Sanskrit name. These glosses are
# project-authored editorial text (source: gita-companion-editorial), not a
# quotation from any translation.

numbering: standard-700
total_verses: 700

chapters:
